name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -- --noUnusedLocals
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sparkforge-kids:ci .
      - name: Container starts and serves the app
        run: |
          docker run -d --name sf -p 3001:3001 sparkforge-kids:ci
          for i in $(seq 1 30); do curl -sf localhost:3001/api/health && break; sleep 1; done
          curl -sf localhost:3001/api/health
          curl -sf localhost:3001/ | grep -q "<title>SparkForge Kids"
          docker logs sf
